<!doctype html>
<html lang="en">
 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="css/index.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="css/loader.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="css/snackbar.css" media="screen" />

    <title>JS4B | Home</title>
    <style>
        html { background: #0b0c10; }
        html.light-mode { background: #e8ecf1; }
    </style>
    <script>
        (function() {
            if (localStorage.getItem('js4b-theme') === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="nav-link" href="#" onclick="clearElements(); return false;">JS4B</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="#" onclick="clearElements(); return false;">Home</a>
                <a class="nav-link" href="liked.html">Liked</a>
            </div>
            <button class="btn btn-sm theme-toggle ms-auto" onclick="toggleTheme()" title="Toggle theme">
                <i class="bi bi-moon-fill"></i>
            </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <!-- Default hero splash -->
            <div class="hero-default">
                <img src="images/rick-and-morty.jpg" alt="Rick and Morty" class="hero-image">
                <h1 class="hero-title">Rick &amp; Morty</h1>
                <p class="hero-subtitle">Characters Explorer</p>
                <div class="hero-divider"></div>
                <button class="btn hero-fetch-btn" onclick="fetchData()">Fetch Character</button>
            </div>

            <!-- Character profile card -->
            <div class="hero-character" style="display:none">
                <div class="profile-card">
                    <div class="profile-avatar-wrap">
                        <img id="heroAvatar" src="images/no-image.jpg" class="profile-avatar" alt="Character avatar" onerror="this.src='images/no-image.jpg'">
                    </div>

                    <h2 class="profile-name" id="heroName">Character Name</h2>

                    <div class="profile-stats">
                        <div class="profile-stat">
                            <span class="profile-stat-value" id="heroSpecies">-</span>
                            <span class="profile-stat-label">Species</span>
                        </div>
                        <div class="profile-stat-divider"></div>
                        <div class="profile-stat">
                            <span class="profile-stat-value" id="heroOrigin">-</span>
                            <span class="profile-stat-label">Origin</span>
                        </div>
                    </div>

                    <div class="profile-info-row">
                        <span class="profile-info-chip" id="heroStatusBadge">
                            <span id="heroStatus">-</span>
                        </span>
                        <span class="profile-info-chip">
                            <i class="bi bi-person"></i> <span id="heroGender">-</span>
                        </span>
                        <span class="profile-info-chip">
                            <i class="bi bi-pin-map"></i> <span id="heroLocation">-</span>
                        </span>
                    </div>

                    <!-- Hidden data carriers for likeIt() -->
                    <span id="heroCharId" style="display:none">-</span>
                    <span id="heroType" style="display:none">-</span>

                    <div class="profile-actions">
                        <button id="heroLike" class="btn profile-btn profile-btn-like" onclick="likeData()" disabled>
                            <i class="bi bi-heart-fill"></i> Like
                        </button>
                        <button class="btn profile-btn profile-btn-fetch" onclick="fetchData()">Fetch Another</button>
                        <button class="btn profile-btn-back" onclick="clearElements()">← Back</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="wrapper container-fluid">
        <footer>
            <p>&copy; JS4B App v 0.2 | Pure JS + Bootstrap sugar</p>
            <p>Developed by <a id="author" target="_blank" href="https://github.com/BaiGanio">Lyuben Kikov</a></p>
        </footer>

        <div id="snackbar"></div>
    </div>

    <div class="loader">
        <div class="inner one"></div>
        <div class="inner two"></div>
        <div class="inner three"></div>
    </div>

    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/fetch.js"></script>
    <script type="text/javascript" src="js/snackbar.js"></script>
    <script>
        function fetchData() {
            fetchIt();
        }
        function likeData() {
            document.getElementById("heroLike").disabled = true;
            likeIt();
        }
    </script>
</body>

</html>
